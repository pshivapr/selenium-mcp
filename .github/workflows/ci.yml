name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SERVER: production

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
        packages: write
        contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint (if available)
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script"; fi
